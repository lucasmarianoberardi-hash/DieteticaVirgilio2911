<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito de Compras</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 20px auto;
      padding: 0 20px;
      background-color: #f9f9f9;
    }

    h1, h2 {
      color: #333;
    }

    .producto {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      padding: 12px 16px;
      margin-bottom: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    .info-producto {
      display: flex;
      flex-direction: column;
    }

    .subtotal-item {
      font-weight: bold;
    }

    .cupon-container {
      background: #fff;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-top: 20px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    input[type="text"] {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    button {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-aplicar {
      background-color: #28a745;
      color: white;
    }

    .btn-remover {
      background-color: #dc3545;
      color: white;
    }

    .resumen-total {
      background: #fff;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-top: 20px;
    }

    .linea-resumen {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .total-final {
      font-size: 1.2em;
      font-weight: bold;
      border-top: 2px solid #eee;
      padding-top: 8px;
    }

    .mensaje {
      margin-top: 8px;
      font-size: 14px;
    }

    .mensaje.exito { color: #28a745; }
    .mensaje.error { color: #dc3545; }
    .tachado { text-decoration: line-through; color: #888; margin-right: 5px; }
  </style>
</head>
<body>

  <h1>Carrito de Compras</h1>

  <div id="lista-productos">
    <!-- Se genera dinámicamente con JS -->
  </div>

  <div class="cupon-container">
    <input type="text" id="input-cupon" placeholder="Ingresá tu cupón (ej: PROMO15)">
    <button class="btn-aplicar" onclick="aplicarCupon()">Aplicar Cupón</button>
    <button class="btn-remover" onclick="removerCupon()">Quitar Cupón</button>
  </div>
  <div id="mensaje-cupon" class="mensaje"></div>

  <div class="resumen-total">
    <h2>Resumen del Pedido</h2>
    <div class="linea-resumen">
      <span>Subtotal productos:</span>
      <span id="resumen-subtotal">$0</span>
    </div>
    <div class="linea-resumen" id="fila-cupon" style="display: none;">
      <span>Descuento Cupón (<span id="nombre-cupon"></span>):</span>
      <span id="resumen-descuento">-$0</span>
    </div>
    <div class="linea-resumen total-final">
      <span>Total:</span>
      <span id="resumen-total">$0</span>
    </div>
  </div>

  <script>
    // 1. Estado global
    const carrito = [
      { id: 1, nombre: "Producto A", precio: 1000, cantidad: 12 }, // Lleva 10+ (correspondería 10%)
      { id: 2, nombre: "Producto B", precio: 2000, cantidad: 25 }  // Lleva 20+ (correspondería 20%)
    ];

    let cuponActivo = null;

    // Cupones disponibles
    const cuponesValidos = {
      "PROMO15": 0.15, // 15% de descuento
      "DESCUENTO10": 0.10
    };

    // 2. Renderizado del carrito y cálculo
    function renderizarCarrito() {
      const contenedorProductos = document.getElementById("lista-productos");
      contenedorProductos.innerHTML = "";

      let subtotalGeneral = 0;
      const hayCupon = cuponActivo !== null;

      carrito.forEach(item => {
        let porcentajeCantidad = 0;

        // Regla: si hay cupón, se ANULA el descuento por cantidad (10% o 20%)
        if (!hayCupon) {
          if (item.cantidad >= 20) {
            porcentajeCantidad = 0.20;
          } else if (item.cantidad >= 10) {
            porcentajeCantidad = 0.10;
          }
        }

        const precioUnitarioFinal = item.precio * (1 - porcentajeCantidad);
        const subtotalItem = precioUnitarioFinal * item.cantidad;
        subtotalGeneral += subtotalItem;

        // Crear elemento HTML para cada producto
        const divProducto = document.createElement("div");
        divProducto.className = "producto";
        divProducto.innerHTML = `
          <div class="info-producto">
            <strong>${item.nombre}</strong>
            <small>Cantidad: ${item.cantidad} | Precio un.: $${item.precio}</small>
            <small>
              ${porcentajeCantidad > 0 
                ? `Descuento por cantidad aplicado: ${porcentajeCantidad * 100}%` 
                : (hayCupon ? `<span style="color: #d9534f;">Promo por cantidad anulada por cupón</span>` : `Sin promo de cantidad`)}
            </small>
          </div>
          <div class="subtotal-item">
            $${subtotalItem.toLocaleString()}
          </div>
        `;
        contenedorProductos.appendChild(divProducto);
      });

      // Calcular descuento final de cupón
      let descuentoCuponValor = 0;
      if (hayCupon) {
        descuentoCuponValor = subtotalGeneral * cuponActivo.porcentaje;
      }

      const totalFinal = subtotalGeneral - descuentoCuponValor;

      // Actualizar resumen en el DOM
      document.getElementById("resumen-subtotal").innerText = `$${subtotalGeneral.toLocaleString()}`;
      
      const filaCupon = document.getElementById("fila-cupon");
      if (hayCupon) {
        filaCupon.style.display = "flex";
        document.getElementById("nombre-cupon").innerText = cuponActivo.codigo;
        document.getElementById("resumen-descuento").innerText = `-$${descuentoCuponValor.toLocaleString()}`;
      } else {
        filaCupon.style.display = "none";
      }

      document.getElementById("resumen-total").innerText = `$${totalFinal.toLocaleString()}`;
    }

    // 3. Funciones para aplicar y quitar cupón
    function aplicarCupon() {
      const input = document.getElementById("input-cupon");
      const mensaje = document.getElementById("mensaje-cupon");
      const codigo = input.value.trim().toUpperCase();

      if (cuponesValidos[codigo]) {
        cuponActivo = {
          codigo: codigo,
          porcentaje: cuponesValidos[codigo]
        };
        mensaje.className = "mensaje exito";
        mensaje.innerText = `Cupón "${codigo}" aplicado con éxito. Se desactivaron los descuentos por volumen.`;
      } else {
        mensaje.className = "mensaje error";
        mensaje.innerText = "El código ingresado no es válido.";
      }

      renderizarCarrito();
    }

    function removerCupon() {
      cuponActivo = null;
      document.getElementById("input-cupon").value = "";
      const mensaje = document.getElementById("mensaje-cupon");
      mensaje.className = "mensaje";
      mensaje.innerText = "Cupón removido. Se reactivaron los descuentos por volumen si corresponden.";
      
      renderizarCarrito();
    }

    // Inicializar la vista
    renderizarCarrito();
  </script>
</body>
</html>
